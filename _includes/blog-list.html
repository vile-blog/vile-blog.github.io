<!-- ================================================================
     BLOG — most recent posts from _posts/
================================================================= -->
<section id="blog" aria-labelledby="blog-heading">
  <div class="container">
    <div class="section-head reveal">
      <p class="eyebrow">~/blog</p>
      <h2 id="blog-heading" class="section-title">{% include t.html en="Recent writing" vi="Bài viết gần đây" %}</h2>
    </div>

    <div class="blog-list">
      {% for p in site.posts limit:3 %}
        {% include blog-item.html post=p %}
      {% endfor %}
    </div>

    <a class="view-all reveal" href="{{ '/blog/' | relative_url }}">
      {% include t.html en="View all posts" vi="Xem tất cả bài viết" %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6"></path>
      </svg>
    </a>
  </div>
</section>
