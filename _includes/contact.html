<!-- ================================================================
     CONTACT
================================================================= -->
<section id="contact" class="contact" aria-labelledby="contact-heading">
  <div class="container">
    <div class="contact-inner reveal">
      <p class="eyebrow" style="justify-content:center">~/contact</p>
      <h2 id="contact-heading" class="contact-title">Let's build something.</h2>
      <p class="contact-sub">
        Have a project in mind, an opening on your team, or just want to
        talk shop? My inbox is open.
      </p>

      <a class="contact-email" href="mailto:{{ site.author.email }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="m22 6-10 7L2 6"></path>
        </svg>
        {{ site.author.email }}
      </a>

      <div class="social-row">
        <a class="icon-btn" href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.17c-3.34.73-4.04-1.42-4.04-1.42-.55-1.4-1.34-1.77-1.34-1.77-1.1-.75.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.08 1.85 2.83 1.32 3.52 1 .11-.79.42-1.32.77-1.62-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.49 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5z"></path></svg>
        </a>
        {% if site.author.linkedin and site.author.linkedin != "" %}
        <a class="icon-btn" href="{{ site.author.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.86 0-2.14 1.45-2.14 2.94v5.66H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.28 2.38 4.28 5.47zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56z"></path></svg>
        </a>
        {% endif %}
        {% if site.author.x and site.author.x != "" %}
        <a class="icon-btn" href="{{ site.author.x }}" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.9 2.4h3.3l-7.2 8.2 8.5 11.2h-6.6l-5.2-6.8-5.9 6.8H2.5l7.7-8.8L2 2.4h6.8l4.7 6.2zm-1.2 17.4h1.8L7.4 4.1H5.5z"></path></svg>
        </a>
        {% endif %}
        <a class="icon-btn" href="mailto:{{ site.author.email }}" aria-label="Email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 6-10 7L2 6"></path></svg>
        </a>
      </div>
    </div>
  </div>
</section>
