<!-- ================================================================
     FOOTER
     Sibling of <main>, not nested inside it — the site footer is not
     main content and shouldn't land inside the main landmark.
================================================================= -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <p>&copy; <span data-year>{{ 'now' | date: "%Y" }}</span> {{ site.author.name }}. <span data-lang-content="en">All rights reserved.</span><span data-lang-content="vi">Bảo lưu mọi quyền.</span></p>
      <p><span data-lang-content="en">Built with Jekyll, hosted on</span><span data-lang-content="vi">Xây dựng bằng Jekyll, lưu trữ trên</span> <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">GitHub Pages</a>.</p>
      <img class="view-badge" src="https://hits.sh/{{ '/' | absolute_url | remove_first: 'https://' }}.svg?label=site%20views&color=3ee089&labelColor=1a1d1f&style=flat" alt="site view count" loading="lazy" width="90" height="20" />
    </div>
  </div>
</footer>
