     NAV
================================================================= -->
<header>
  <nav class="site-nav" aria-label="Primary">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="brand">
        <span class="brand-mark" aria-hidden="true">{{ site.author.initials }}</span>
        <span class="brand-prompt">{{ site.title | downcase | remove: " " }}.dev</span>
      </a>

      <ul class="nav-links" data-nav-links>
        <li><a href="{{ '/' | relative_url }}#about">About</a></li>
        <li><a href="{{ '/' | relative_url }}#projects">Projects</a></li>
        <li><a href="{{ '/' | relative_url }}#blog">Blog</a></li>
        <li><a href="{{ '/' | relative_url }}#contact">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <button
          type="button"
          class="icon-btn theme-toggle"
          data-theme-toggle
          aria-pressed="false"
          aria-label="Toggle light and dark theme"
        >
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <a
          class="icon-btn"
          href="https://github.com/{{ site.author.github }}"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="{{ site.author.name }} on GitHub"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.17c-3.34.73-4.04-1.42-4.04-1.42-.55-1.4-1.34-1.77-1.34-1.77-1.1-.75.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.08 1.85 2.83 1.32 3.52 1 .11-.79.42-1.32.77-1.62-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.49 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5z"></path>
          </svg>
        </a>

        <button
          type="button"
          class="icon-btn nav-toggle"
          data-nav-toggle
          aria-label="Toggle navigation menu"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M3 6h18M3 12h18M3 18h18"></path>
          </svg>
        </button>
      </div>
    </div>
  </nav>
</header>
