<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Theme is applied here, before first paint, to avoid a flash of the
     wrong theme. Priority: stored preference -> OS preference -> dark. -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem("vile-theme");
      var theme = stored
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
{% feed_meta %}
{% seo %}
</head>
<body>

<!-- Background atmosphere: faint grid + soft accent glow behind hero -->

<div class="bg-glow" aria-hidden="true"></div>

</body>
</html>
