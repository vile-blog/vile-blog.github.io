<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Theme is applied here, before first paint, to avoid a flash of the
     wrong theme. Priority: stored preference -> OS preference -> dark. -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem("vile-theme");
      var theme = stored
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>

<!-- Language is applied here too, before first paint, for the same
     flash-avoidance reason. Priority: stored preference -> browser
     language -> English. -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem("vile-lang");
      var lang = stored
        ? stored
        : (navigator.language && navigator.language.toLowerCase().indexOf("vi") === 0
            ? "vi"
            : "en");
      document.documentElement.setAttribute("data-lang", lang);
    } catch (e) {
      document.documentElement.setAttribute("data-lang", "en");
    }
  })();
</script>

<!-- Hidden "hacker" mode (Konami code / `matrix` in the hero terminal). -->
<script>
  try { if (localStorage.getItem("vile-hacker") === "1") document.documentElement.classList.add("hacker"); } catch (e) {}
</script>

<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<meta name="site-base" content="{{ '/' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/extras.css' | relative_url }}" />
{% if page.lab %}<link rel="stylesheet" href="{{ '/assets/css/lab.css' | relative_url }}" />{% endif %}
{% feed_meta %}
{% seo %}
</head>
<body>

<!-- Background atmosphere: faint grid + soft accent glow behind hero -->
<div class="bg-texture" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>

{% include nav.html %}

<main id="top">
  {{ content }}
</main>

{% include footer.html %}

{% include chatbot.html %}

{% include palette.html %}

<button type="button" class="icon-btn back-to-top" data-back-to-top aria-label="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19V5M5 12l7-7 7 7"></path>
  </svg>
</button>

<script src="{{ '/assets/js/script.js' | relative_url }}"></script>
<script src="{{ '/assets/js/extras.js' | relative_url }}"></script>
<script src="{{ '/assets/js/chaos.js' | relative_url }}"></script>
{% if page.lab %}<script src="{{ '/assets/js/lab.js' | relative_url }}"></script>{% endif %}
{% if page.layout == "post" %}<script src="{{ '/assets/js/reader.js' | relative_url }}"></script>{% endif %}
</body>
</html>
