title: Vi Le
tagline: "Software Engineer — building backend systems & AI agents"
description: >-
  Personal site and blog of Vi Le — software engineer, ex-Grab, founder of
  Hustly Space. Projects, writing, and notes on building software.
url: "https://vile-blog.github.io"
baseurl: ""
title_separator: "—"

author:
  name: Vi Le
  initials: "VL"
  role: "Software Engineer"
  tagline: "building backend systems & AI agents"
  email: vikimmich6@gmail.com
  github: lcv-engineer
  linkedin: "https://linkedin.com/in/vilecong"
  x: ""
  bio: >-
    I'm a software engineer with 3 years of experience building backend
    systems — including the messaging platform and experimentation platform
    teams at Grab. I'm also the founder of Hustly Space, a platform helping
    students discover competitions and build teams. This site is where I
    share projects and write about what I'm learning.
  intro: >-
    I design and ship backend systems and AI products end to end — from
    messaging and experimentation platforms at Grab to founding Hustly
    Space. This is where I keep my projects and write down what I'm learning.
  skills:
    - Go
    - Kafka
    - AWS
    - AI Multi-Agent Systems
    - PostgreSQL
    - React
  stats:
    - value: "3+"
      label: "years experience"
    - value: "6+"
      label: "projects shipped"
    - value: "∞"
      label: "cups of coffee"

# Build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
timezone: Asia/Ho_Chi_Minh

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
