# Build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
timezone: Asia/Ho_Chi_Minh

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
