<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">
  <rect width="760" height="300" rx="12" fill="#0d0f10"/>
  <rect x="1" y="1" width="758" height="298" rx="11" fill="none" stroke="rgba(232,232,230,0.16)"/>
  <text x="380" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#e8e8e6">Rolling deploy: old and new code run at the same time</text>

  <!-- timeline -->
  <line x1="60" y1="90" x2="700" y2="90" stroke="rgba(232,232,230,0.16)" stroke-width="1.5"/>
  <text x="60" y="75" font-size="10" fill="#868c92">server fleet, mid-deploy</text>

  <rect x="60" y="105" width="110" height="30" rx="6" fill="#1a1d1f" stroke="#3ee089"/>
  <text x="115" y="125" text-anchor="middle" font-size="9.5" fill="#e8e8e6">server (v1, old)</text>

  <rect x="200" y="105" width="110" height="30" rx="6" fill="#1a1d1f" stroke="#7fd4ff"/>
  <text x="255" y="125" text-anchor="middle" font-size="9.5" fill="#e8e8e6">server (v2, new)</text>

  <rect x="340" y="105" width="110" height="30" rx="6" fill="#1a1d1f" stroke="#3ee089"/>
  <text x="395" y="125" text-anchor="middle" font-size="9.5" fill="#e8e8e6">server (v1, old)</text>

  <rect x="480" y="105" width="110" height="30" rx="6" fill="#1a1d1f" stroke="#7fd4ff"/>
  <text x="535" y="125" text-anchor="middle" font-size="9.5" fill="#e8e8e6">server (v2, new)</text>

  <!-- shared message -->
  <line x1="115" y1="135" x2="115" y2="190" stroke="#3ee089" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="255" y1="135" x2="255" y2="190" stroke="#7fd4ff" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="395" y1="135" x2="395" y2="190" stroke="#3ee089" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="535" y1="135" x2="535" y2="190" stroke="#7fd4ff" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="230" y="190" width="300" height="46" rx="8" fill="#14171a" stroke="#ffb454"/>
  <text x="380" y="208" text-anchor="middle" font-size="10" fill="#e8e8e6">same message format on the wire</text>
  <text x="380" y="224" text-anchor="middle" font-size="9" fill="#868c92">Protobuf / Avro / Thrift — old fields kept, new fields optional</text>

  <text x="380" y="266" text-anchor="middle" font-size="10" fill="#868c92">backward compatible: new code reads old messages</text>
  <text x="380" y="281" text-anchor="middle" font-size="10" fill="#868c92">forward compatible: old code reads new messages, ignoring fields it doesn't know</text>
</svg>
