<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">
  <rect width="760" height="320" rx="12" fill="#0d0f10"/>
  <rect x="1" y="1" width="758" height="318" rx="11" fill="none" stroke="rgba(232,232,230,0.16)"/>
  <text x="380" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#e8e8e6">Chaining batch jobs: write-to-disk vs. stay-in-memory</text>
  <line x1="380" y1="46" x2="380" y2="290" stroke="rgba(232,232,230,0.16)"/>

  <!-- MapReduce / Hadoop -->
  <text x="190" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb454">MapReduce (Hadoop)</text>

  <rect x="110" y="82" width="60" height="26" rx="5" fill="#1a1d1f" stroke="#ffb454"/>
  <text x="140" y="99" text-anchor="middle" font-size="8.5" fill="#e8e8e6">job A</text>
  <rect x="210" y="82" width="60" height="26" rx="5" fill="#1a1d1f" stroke="#ffb454"/>
  <text x="240" y="99" text-anchor="middle" font-size="8.5" fill="#e8e8e6">job B</text>

  <line x1="140" y1="108" x2="140" y2="130" stroke="#ffb454" stroke-width="1.3"/>
  <rect x="105" y="130" width="70" height="24" rx="4" fill="#14171a" stroke="rgba(232,232,230,0.16)"/>
  <text x="140" y="146" text-anchor="middle" font-size="8" fill="#e8e8e6">HDFS (disk)</text>
  <line x1="140" y1="154" x2="240" y2="82" stroke="#ffb454" stroke-width="1.1" stroke-dasharray="2 2"/>

  <line x1="240" y1="108" x2="240" y2="130" stroke="#ffb454" stroke-width="1.3"/>
  <rect x="205" y="130" width="70" height="24" rx="4" fill="#14171a" stroke="rgba(232,232,230,0.16)"/>
  <text x="240" y="146" text-anchor="middle" font-size="8" fill="#e8e8e6">HDFS (disk)</text>

  <text x="190" y="180" text-anchor="middle" font-size="9" fill="#868c92">every job's output is fully</text>
  <text x="190" y="193" text-anchor="middle" font-size="9" fill="#868c92">written to disk before the</text>
  <text x="190" y="206" text-anchor="middle" font-size="9" fill="#868c92">next job can start reading it</text>

  <!-- Dataflow engine / Spark -->
  <text x="570" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#7fd4ff">dataflow engine (Spark, Flink)</text>

  <rect x="490" y="90" width="55" height="26" rx="5" fill="#1a1d1f" stroke="#7fd4ff"/>
  <text x="517" y="107" text-anchor="middle" font-size="8" fill="#e8e8e6">stage A</text>
  <rect x="555" y="90" width="55" height="26" rx="5" fill="#1a1d1f" stroke="#7fd4ff"/>
  <text x="582" y="107" text-anchor="middle" font-size="8" fill="#e8e8e6">stage B</text>
  <rect x="620" y="90" width="55" height="26" rx="5" fill="#1a1d1f" stroke="#7fd4ff"/>
  <text x="647" y="107" text-anchor="middle" font-size="8" fill="#e8e8e6">stage C</text>

  <line x1="545" y1="103" x2="555" y2="103" stroke="#7fd4ff" stroke-width="1.5"/>
  <line x1="610" y1="103" x2="620" y2="103" stroke="#7fd4ff" stroke-width="1.5"/>
  <text x="582" y="130" text-anchor="middle" font-size="8" fill="#7fd4ff">kept in memory between stages</text>

  <rect x="620" y="150" width="55" height="22" rx="4" fill="#14171a" stroke="rgba(232,232,230,0.16)"/>
  <text x="647" y="164" text-anchor="middle" font-size="7.5" fill="#e8e8e6">disk</text>
  <line x1="647" y1="116" x2="647" y2="150" stroke="rgba(232,232,230,0.3)" stroke-width="1" stroke-dasharray="2 2"/>

  <text x="570" y="195" text-anchor="middle" font-size="9" fill="#868c92">only the final result touches</text>
  <text x="570" y="208" text-anchor="middle" font-size="9" fill="#868c92">disk — like Unix pipes chaining</text>
  <text x="570" y="221" text-anchor="middle" font-size="9" fill="#868c92">commands without temp files</text>

  <text x="380" y="260" text-anchor="middle" font-size="10" fill="#868c92">same job — process a huge dataset in stages — very different</text>
  <text x="380" y="275" text-anchor="middle" font-size="10" fill="#868c92">cost per stage boundary</text>
</svg>
