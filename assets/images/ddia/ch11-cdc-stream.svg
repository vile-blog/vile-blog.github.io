<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">
  <rect width="760" height="320" rx="12" fill="#0d0f10"/>
  <rect x="1" y="1" width="758" height="318" rx="11" fill="none" stroke="rgba(232,232,230,0.16)"/>
  <text x="380" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#e8e8e6">Change data capture: one log, many independent readers</text>

  <rect x="40" y="70" width="90" height="34" rx="7" fill="#1a1d1f" stroke="#3ee089"/>
  <text x="85" y="91" text-anchor="middle" font-size="10" fill="#e8e8e6">database</text>

  <line x1="130" y1="87" x2="190" y2="87" stroke="#3ee089" stroke-width="1.5"/>
  <text x="160" y="78" text-anchor="middle" font-size="8" fill="#868c92">CDC</text>

  <rect x="190" y="70" width="110" height="34" rx="7" fill="#1a1d1f" stroke="#7fd4ff"/>
  <text x="245" y="87" text-anchor="middle" font-size="9.5" fill="#e8e8e6">Kafka topic</text>
  <text x="245" y="99" text-anchor="middle" font-size="8" fill="#868c92">(durable, ordered log)</text>

  <line x1="300" y1="87" x2="360" y2="87" stroke="#7fd4ff" stroke-width="1.3"/>
  <line x1="300" y1="87" x2="360" y2="150" stroke="#7fd4ff" stroke-width="1.3"/>
  <line x1="300" y1="87" x2="360" y2="213" stroke="#7fd4ff" stroke-width="1.3"/>

  <rect x="360" y="70" width="120" height="34" rx="7" fill="#14171a" stroke="rgba(232,232,230,0.16)"/>
  <text x="420" y="91" text-anchor="middle" font-size="9.5" fill="#e8e8e6">search index</text>

  <rect x="360" y="133" width="120" height="34" rx="7" fill="#14171a" stroke="rgba(232,232,230,0.16)"/>
  <text x="420" y="154" text-anchor="middle" font-size="9.5" fill="#e8e8e6">cache</text>

  <rect x="360" y="196" width="120" height="34" rx="7" fill="#14171a" stroke="rgba(232,232,230,0.16)"/>
  <text x="420" y="217" text-anchor="middle" font-size="9.5" fill="#e8e8e6">fraud detector</text>

  <text x="600" y="87" text-anchor="middle" font-size="8.5" fill="#868c92">each consumer reads</text>
  <text x="600" y="100" text-anchor="middle" font-size="8.5" fill="#868c92">at its own pace, from</text>
  <text x="600" y="113" text-anchor="middle" font-size="8.5" fill="#868c92">wherever it left off</text>

  <text x="380" y="270" text-anchor="middle" font-size="10" fill="#868c92">the database never talks to these consumers directly —</text>
  <text x="380" y="285" text-anchor="middle" font-size="10" fill="#868c92">every change becomes an event on the log, exactly once</text>
</svg>
