<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">
  <rect width="760" height="300" rx="12" fill="#0d0f10"/>
  <rect x="1" y="1" width="758" height="298" rx="11" fill="none" stroke="rgba(232,232,230,0.16)"/>
  <text x="380" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#e8e8e6">Lost update: two shoppers, one last item in stock</text>

  <line x1="200" y1="55" x2="200" y2="260" stroke="rgba(232,232,230,0.12)"/>
  <line x1="560" y1="55" x2="560" y2="260" stroke="rgba(232,232,230,0.12)"/>
  <text x="200" y="50" text-anchor="middle" font-size="10.5" fill="#3ee089">Shopper A</text>
  <text x="560" y="50" text-anchor="middle" font-size="10.5" fill="#7fd4ff">Shopper B</text>

  <rect x="330" y="70" width="100" height="26" rx="5" fill="#14171a" stroke="rgba(232,232,230,0.16)"/>
  <text x="380" y="87" text-anchor="middle" font-size="9.5" fill="#e8e8e6">stock = 1</text>

  <rect x="140" y="112" width="120" height="26" rx="5" fill="#1a1d1f" stroke="#3ee089"/>
  <text x="200" y="129" text-anchor="middle" font-size="9" fill="#e8e8e6">reads stock: 1</text>
  <rect x="500" y="112" width="120" height="26" rx="5" fill="#1a1d1f" stroke="#7fd4ff"/>
  <text x="560" y="129" text-anchor="middle" font-size="9" fill="#e8e8e6">reads stock: 1</text>

  <rect x="140" y="150" width="120" height="26" rx="5" fill="#1a1d1f" stroke="#3ee089"/>
  <text x="200" y="167" text-anchor="middle" font-size="9" fill="#e8e8e6">buys 1 → writes 0</text>
  <rect x="500" y="150" width="120" height="26" rx="5" fill="#1a1d1f" stroke="#7fd4ff"/>
  <text x="560" y="167" text-anchor="middle" font-size="9" fill="#e8e8e6">buys 1 → writes 0</text>

  <rect x="330" y="192" width="100" height="26" rx="5" fill="#14171a" stroke="#ffb454"/>
  <text x="380" y="209" text-anchor="middle" font-size="9.5" fill="#e8e8e6">stock = 0</text>

  <text x="380" y="240" text-anchor="middle" font-size="10" fill="#ffb454">both orders "succeed" — one item sold twice</text>
  <text x="380" y="256" text-anchor="middle" font-size="10" fill="#868c92">fixed by serializable isolation or an atomic decrement</text>
</svg>
