      url: "https://redis.io/docs/latest/operate/rs/databases/active-active/"
    - name: "Riak data types"
      en: "Riak shipped counters, sets, maps, flags and registers as server-side CRDTs, so applications could update them concurrently without writing their own conflict resolution."
      vi: "Riak cung cấp counter, set, map, flag và register dưới dạng CRDT phía server, để ứng dụng cập nhật đồng thời mà không phải tự viết giải quyết xung đột."
      url: "https://docs.riak.com/riak/kv/latest/developing/data-types/index.html"
    - name: "Automerge and Yjs"
