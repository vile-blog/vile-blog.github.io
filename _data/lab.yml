quorum:
  overview: "In a leaderless or multi-replica store, a write is acknowledged once W of the N replicas have it, and a read consults R replicas and keeps the newest answer. If W + R > N, every read set must share at least one replica with the most recent successful write set, so the read can see that write. Turning W and R is a dial between speed, availability and freshness: W=1,R=1 is fast and available but stale-prone; W=N or R=N is fresh but one dead replica blocks you."
  overview_vi: "Trong kho dữ liệu nhiều replica không leader, một lần ghi được xác nhận khi W trong N replica đã có nó, còn lần đọc hỏi R replica và lấy câu trả lời mới nhất. Nếu W + R > N thì mọi tập đọc phải chung ít nhất một replica với tập ghi thành công gần nhất, nên lần đọc có thể thấy bản ghi đó. Chỉnh W và R là một núm vặn giữa tốc độ, tính sẵn sàng và độ tươi: W=1,R=1 nhanh và sẵn sàng nhưng dễ đọc cũ; W=N hoặc R=N luôn tươi nhưng một replica chết là bị chặn."
  how:
    - en: "A write is sent to all N replicas but the client only waits for W acknowledgements. The other replicas receive it a little later (replication lag)."
      vi: "Lần ghi được gửi tới cả N replica nhưng client chỉ chờ W xác nhận. Các replica còn lại nhận muộn hơn một chút (độ trễ sao chép)."
    - en: "A read asks R replicas and returns the value with the highest version. If W + R > N the two groups overlap, so at least one answer is the latest."
      vi: "Lần đọc hỏi R replica và trả về giá trị có version cao nhất. Nếu W + R > N hai nhóm giao nhau, nên ít nhất một câu trả lời là mới nhất."
    - en: "Probability of a stale read when sets don't overlap: C(N−W, R) / C(N, R), the chance that every one of the R replicas you picked is among the N−W that missed the write."
      vi: "Xác suất đọc cũ khi hai tập không giao nhau: C(N−W, R) / C(N, R), tức khả năng cả R replica bạn chọn đều nằm trong N−W replica chưa nhận bản ghi."
    - en: "Click a replica to crash it. With fewer than W live replicas writes are rejected, with fewer than R reads are rejected. That is the availability price of a strict quorum."
      vi: "Bấm vào replica để làm sập nó. Còn ít hơn W replica sống thì ghi bị từ chối, ít hơn R thì đọc bị từ chối. Đó là cái giá về tính sẵn sàng của quorum chặt."
  simplified:
    en: "Reality is messier. A quorum read is not automatically linearizable: concurrent writes, last-write-wins timestamps, sloppy quorums with hinted handoff, and a write that fails after reaching fewer than W replicas can all still produce surprising reads. Real systems add read repair and anti-entropy to converge replicas."
    vi: "Thực tế phức tạp hơn. Một lần đọc theo quorum không tự động linearizable: ghi đồng thời, timestamp last-write-wins, sloppy quorum với hinted handoff, và lần ghi thất bại sau khi tới chưa đủ W replica vẫn có thể gây ra kết quả đọc bất ngờ. Hệ thống thật thêm read repair và anti-entropy để các replica hội tụ."
  notice:
    en: "Try this: set N=5, W=2, R=2 and run 500 trials: about 30% of reads are stale, matching C(3,2)/C(5,2) = 3/10. Now set W=3, R=3. The stale rate drops to exactly 0, but crash three replicas and writes stop."
    vi: "Thử xem: đặt N=5, W=2, R=2 và chạy 500 lần: khoảng 30% lần đọc bị cũ, khớp C(3,2)/C(5,2) = 3/10. Giờ đặt W=3, R=3. Tỉ lệ cũ xuống đúng 0, nhưng sập ba replica là ghi dừng hẳn."
  experiments:
    - id: fast-stale
      en: "Fast but stale (W=1, R=1)"
      vi: "Nhanh nhưng cũ (W=1, R=1)"
    - id: strict
      en: "Strict quorum (W=3, R=3)"
      vi: "Quorum chặt (W=3, R=3)"
    - id: read-heavy
      en: "Read-optimised (W=5, R=1)"
      vi: "Tối ưu đọc (W=5, R=1)"
    - id: crash-two
      en: "Strict quorum, then crash 3 replicas"
      vi: "Quorum chặt, rồi làm sập 3 replica"
  usecases:
    - name: "Apache Cassandra"
      en: "Per-query consistency levels ONE, QUORUM, ALL (and LOCAL_QUORUM across datacenters) are exactly the W and R dial. QUORUM writes plus QUORUM reads give W + R > N."
      vi: "Mức nhất quán theo từng truy vấn ONE, QUORUM, ALL (và LOCAL_QUORUM giữa các datacenter) chính là núm W và R. Ghi QUORUM cộng đọc QUORUM cho W + R > N."
      url: "https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html#tunable-consistency"
    - name: "Amazon DynamoDB"
      en: "Reads are eventually consistent by default; you can ask for a strongly consistent read that goes to the leader replica, at double the read cost."
      vi: "Mặc định đọc là eventually consistent; bạn có thể yêu cầu đọc strongly consistent đi qua replica leader, với chi phí đọc gấp đôi."
      url: "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html"
    - name: "Apache Kafka"
      en: "acks=all together with min.insync.replicas is a write quorum: a producer is only told 'success' once enough in-sync replicas have the record."
      vi: "acks=all kết hợp min.insync.replicas là một write quorum: producer chỉ được báo 'thành công' khi đủ replica đồng bộ đã có bản ghi."
      url: "https://kafka.apache.org/documentation/#producerconfigs_acks"
    - name: "MongoDB"
      en: "Write concern w:majority and read concern 'majority' trade latency for the guarantee that data will not be rolled back after a failover."
      vi: "Write concern w:majority và read concern 'majority' đánh đổi độ trễ lấy đảm bảo dữ liệu không bị rollback sau failover."
      url: "https://www.mongodb.com/docs/manual/reference/write-concern/"
    - name: "Riak"
      en: "The textbook Dynamo descendant: n_val, r and w are per-bucket or per-request settings, with sibling resolution for conflicts."
      vi: "Hậu duệ điển hình của Dynamo: n_val, r và w đặt theo bucket hoặc theo yêu cầu, kèm xử lý sibling khi xung đột."
      url: "https://en.wikipedia.org/wiki/Riak"
  papers:
    - title: "Weighted Voting for Replicated Data"
      authors: "David K. Gifford"
      venue: "SOSP 1979"
      url: "https://dl.acm.org/doi/10.1145/800215.806583"
      en: "Where read and write quorums with R + W > N come from. Over 45 years old and still the model."
      vi: "Nguồn gốc của read/write quorum với R + W > N. Hơn 45 năm tuổi và vẫn là mô hình hiện hành."
    - title: "Sharing Memory Robustly in Message-Passing Systems"
      authors: "Attiya, Bar-Noy, Dolev"
      venue: "JACM 1995"
      url: "https://dl.acm.org/doi/10.1145/200836.200869"
      en: "The ABD algorithm: shows how majority quorums plus a write-back on read give a linearizable register."
      vi: "Thuật toán ABD: chỉ ra cách quorum đa số cộng việc ghi lại khi đọc cho một thanh ghi linearizable."
    - title: "Dynamo: Amazon's Highly Available Key-value Store"
      authors: "DeCandia et al."
      venue: "SOSP 2007"
      url: "https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf"
      en: "Introduced (N, R, W) as the configurable knobs and sloppy quorums with hinted handoff to stay writable during failures."
      vi: "Giới thiệu (N, R, W) như các núm cấu hình và sloppy quorum với hinted handoff để vẫn ghi được khi có sự cố."
    - title: "Probabilistically Bounded Staleness for Practical Partial Quorums"
      authors: "Bailis, Venkataraman, Franklin, Hellerstein, Stoica"
      venue: "VLDB 2012"
      url: "https://vldb.org/pvldb/vol5/p776_peterbailis_vldb2012.pdf"
      en: "Measures how stale partial quorums really are over time in Cassandra and Riak. Even with N=3 and R=W=1, reads are typically consistent again within a few hundred milliseconds."
      vi: "Đo độ cũ thực sự của partial quorum theo thời gian trong Cassandra và Riak. Ngay cả với N=3 và R=W=1, các lần đọc thường nhất quán trở lại sau vài trăm mili giây."
  reading:
    - title: "Eventually Consistent"
      source: "Werner Vogels, All Things Distributed"
      url: "https://www.allthingsdistributed.com/2008/12/eventually_consistent.html"
      en: "Amazon's CTO on the N, R, W model and why consistency is a spectrum of choices."
      vi: "CTO của Amazon viết về mô hình N, R, W và vì sao nhất quán là một dải lựa chọn."
    - title: "Please stop calling databases CP or AP"
      source: "Martin Kleppmann"
      url: "https://martin.kleppmann.com/2015/05/11/please-stop-calling-databases-cp-or-ap.html"
      en: "Why the CAP labels hide more than they show, and what to talk about instead."
      vi: "Vì sao nhãn CAP che giấu nhiều hơn là cho thấy, và nên bàn về điều gì thay vào đó."
    - title: "Jepsen: Consistency Models"
      source: "jepsen.io"
      url: "https://jepsen.io/consistency"
      en: "An interactive map of consistency models, from read-uncommitted to strict serializable, and how they relate."
      vi: "Bản đồ tương tác về các mô hình nhất quán, từ read-uncommitted đến strict serializable, và quan hệ giữa chúng."
    - title: "Probabilistically Bounded Staleness (PBS) demo"
      source: "UC Berkeley"
      url: "http://pbs.cs.berkeley.edu/"
      en: "The authors' own interactive model of staleness over time, the real-world cousin of this lab."
      vi: "Mô hình tương tác do chính tác giả làm về độ cũ theo thời gian, người anh em thực tế của lab này."
