gossip:
  overview: "Gossip (epidemic) protocols spread information the way a rumour or a virus spreads: every round, each node that knows something tells a few randomly chosen peers, who do the same. There is no coordinator and no fixed topology, so there is no single point of failure and the load per node stays tiny. The number of informed nodes roughly multiplies every round, so news reaches N nodes in about log N rounds, and it keeps working when messages are lost or nodes die. The same idea powers cluster membership: SWIM lets nodes detect crashed peers by randomly probing each other and piggy-backing the verdict on those probes."
  overview_vi: "Gossip (epidemic protocol) lan thông tin giống như tin đồn hay virus: mỗi vòng, mọi node biết tin sẽ kể cho vài node ngẫu nhiên, những node này lại làm tương tự. Không có điều phối viên và không có cấu trúc cố định nên không có điểm lỗi đơn lẻ, và tải trên mỗi node rất nhỏ. Số node đã biết tin xấp xỉ nhân lên mỗi vòng, nên tin đến N node trong khoảng log N vòng, và vẫn chạy tốt khi gói tin bị mất hay node chết. Cùng ý tưởng đó dùng cho quản lý thành viên cụm: SWIM cho các node phát hiện peer bị sập bằng cách dò ngẫu nhiên lẫn nhau và gắn phán quyết vào chính các lần dò đó."
  how:
    - en: "Rumour mode, push: each round every informed node sends the rumour to 'fanout' random peers. Pull is the mirror image (uninformed nodes ask random peers), and push-pull does both. Push is fast at the start and slow at the end (few nodes are left to find); pull is the opposite, which is why real systems often combine them."
      vi: "Chế độ tin đồn, push: mỗi vòng mọi node đã biết gửi tin cho 'fanout' node ngẫu nhiên. Pull là ngược lại (node chưa biết đi hỏi node ngẫu nhiên), push-pull làm cả hai. Push nhanh lúc đầu và chậm lúc cuối (còn ít node để tìm); pull thì ngược lại, nên các hệ thống thật hay kết hợp cả hai."
    - en: "Failure detector: every round each node pings one random peer. If no ack arrives it asks k other nodes to ping the target on its behalf (ping-req). Only if all of those fail does it mark the peer suspect."
      vi: "Phát hiện lỗi: mỗi vòng mỗi node ping một node ngẫu nhiên. Nếu không có ack, nó nhờ k node khác ping hộ (ping-req). Chỉ khi tất cả đều thất bại nó mới đánh dấu peer là nghi ngờ."
    - en: "A suspect has a few rounds to prove it is alive. Any node that hears it is suspected refutes by bumping its own incarnation number and gossiping 'alive'. A higher incarnation beats an older suspicion; if nobody refutes in time, the verdict becomes dead."
      vi: "Node bị nghi có vài vòng để chứng minh còn sống. Node nào nghe mình bị nghi sẽ bác bỏ bằng cách tăng số incarnation của mình và lan tin 'còn sống'. Incarnation cao hơn thắng lời nghi cũ; nếu không ai bác bỏ kịp, phán quyết thành chết."
    - en: "Updates travel for free: each ping and ack carries a few recent membership changes. Every change is piggy-backed a fixed number of times (about 3·log₂N), and each round a node also gossips to two random peers, so a cluster of N nodes converges in O(log N) rounds with constant work per node."
      vi: "Tin cập nhật đi miễn phí: mỗi ping và ack mang theo vài thay đổi thành viên gần nhất. Mỗi thay đổi được gắn kèm một số lần cố định (khoảng 3·log₂N) và mỗi vòng node còn gossip thêm cho hai node ngẫu nhiên, nên cụm N node hội tụ trong O(log N) vòng với công việc không đổi trên mỗi node."
  simplified:
    en: "Simplified: rounds are synchronous (real nodes use independent timers), the network is a complete graph with uniform random loss, a probe resolves within its round, and the suspicion timeout is a fixed 6 rounds instead of scaling with cluster size. Dead nodes cannot be probed or contacted, but a revived node simply rejoins with a higher incarnation."
    vi: "Đã đơn giản hóa: các vòng đồng bộ (node thật dùng bộ đếm độc lập), mạng là đồ thị đầy đủ với mất gói ngẫu nhiên đều, một lần dò xong trong vòng của nó, và thời gian chờ nghi ngờ cố định 6 vòng thay vì co giãn theo kích thước cụm. Node chết không dò hay liên lạc được, còn node hồi sinh chỉ cần tham gia lại với incarnation cao hơn."
  notice:
    en: "Try this: switch to Failure detector, set packet loss to 15% and the indirect probes to 0, then watch healthy nodes turn amber and sometimes red. Raise k to 3 and the false alarms drop sharply: asking friends to double-check is what makes SWIM robust to a flaky link (HashiCorp's Lifeguard paper pushes the same idea further by making slow nodes doubt themselves)."
    vi: "Thử xem: chuyển sang Phát hiện lỗi, đặt mất gói 15% và số lần dò gián tiếp về 0, rồi xem các node khỏe chuyển sang vàng và đôi khi đỏ. Tăng k lên 3 thì báo động giả giảm mạnh: nhờ bạn kiểm tra lại là điều khiến SWIM chịu được đường truyền chập chờn (bài Lifeguard của HashiCorp đẩy ý này xa hơn bằng cách để node chậm tự nghi ngờ chính mình)."
  experiments:
    - id: spread
      en: "Spread a rumour (fanout 1)"
      vi: "Lan một tin đồn (fanout 1)"
    - id: fanout
      en: "Fanout 3: faster, but how many more messages?"
      vi: "Fanout 3: nhanh hơn, nhưng tốn thêm bao nhiêu tin?"
    - id: lossy
      en: "40% packet loss, push-pull"
      vi: "Mất 40% gói, push-pull"
    - id: crash-one
      en: "Crash a node and watch it get detected"
      vi: "Làm sập một node và xem nó bị phát hiện"
    - id: false-alarm
      en: "False alarms: 15% loss, no indirect probes"
      vi: "Báo động giả: mất 15% gói, không dò gián tiếp"
    - id: indirect
      en: "Same loss, but 3 indirect probes"
      vi: "Cùng mức mất gói, nhưng 3 lần dò gián tiếp"
  usecases:
    - name: "Apache Cassandra"
      en: "Every node gossips with a few peers every second to share which nodes exist, their tokens, load and up/down state. There is no master to ask: a new node only needs the address of a seed."
      vi: "Mỗi node gossip với vài peer mỗi giây để chia sẻ có những node nào, token, tải và trạng thái sống/chết. Không có master để hỏi: node mới chỉ cần địa chỉ của một seed."
      url: "https://docs.datastax.com/en/cassandra-oss/3.x/cassandra/architecture/archGossipAbout.html"
    - name: "Consul and Serf (memberlist)"
      en: "HashiCorp's memberlist library implements SWIM with extensions and underpins Serf and Consul's LAN/WAN gossip pools, which handle membership and failure detection for the whole fleet."
      vi: "Thư viện memberlist của HashiCorp cài SWIM kèm các cải tiến và là nền của các gossip pool LAN/WAN trong Serf và Consul, lo quản lý thành viên và phát hiện lỗi cho toàn bộ hệ thống."
      url: "https://developer.hashicorp.com/consul/docs/architecture/gossip"
    - name: "Redis Cluster"
      en: "Nodes talk over a cluster bus using gossip. A node is flagged PFAIL by one peer, and promoted to FAIL once a majority of masters report the same, which triggers a replica failover."
      vi: "Các node nói chuyện qua cluster bus bằng gossip. Một node bị một peer đánh dấu PFAIL, và lên FAIL khi đa số master báo giống vậy, từ đó kích hoạt chuyển đổi sang replica."
      url: "https://redis.io/docs/latest/operate/oss_and_stack/reference/cluster-spec/"
    - name: "Amazon Dynamo"
      en: "Dynamo uses a gossip-based protocol so each node learns the membership and ring partitioning of its peers, and uses it to detect and route around failed nodes."
      vi: "Dynamo dùng giao thức dựa trên gossip để mỗi node biết thành viên và cách chia vòng của các peer, rồi dùng để phát hiện và né node hỏng."
      url: "https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf"
    - name: "Serf"
      en: "A lightweight tool for cluster membership, failure detection and custom events. Its docs include a convergence simulator that shows how long gossip takes at your cluster size."
      vi: "Công cụ nhẹ cho quản lý thành viên, phát hiện lỗi và sự kiện tùy chỉnh. Tài liệu của nó có trình mô phỏng hội tụ cho biết gossip mất bao lâu ở kích thước cụm của bạn."
      url: "https://github.com/hashicorp/serf"
  papers:
    - title: "Epidemic Algorithms for Replicated Database Maintenance"
      authors: "Alan Demers et al."
      venue: "PODC 1987"
      url: "https://dl.acm.org/doi/10.1145/41840.41841"
      en: "The paper that introduced gossip to distributed systems, from Xerox PARC: direct mail, anti-entropy and rumour mongering for keeping replicas in sync."
      vi: "Bài báo đưa gossip vào hệ phân tán, từ Xerox PARC: direct mail, anti-entropy và rumour mongering để giữ các replica đồng bộ."
    - title: "SWIM: Scalable Weakly-consistent Infection-style Process Group Membership Protocol"
      authors: "Abhinandan Das, Indranil Gupta, Ashish Motivala"
      venue: "DSN 2002"
      url: "https://www.cs.cornell.edu/projects/Quicksilver/public_pdfs/SWIM.pdf"
      en: "Randomised probing with indirect ping-req and piggy-backed updates. Detection time and message load per node stay constant as the group grows, which is the part the demo shows."
      vi: "Dò ngẫu nhiên với ping-req gián tiếp và tin cập nhật gắn kèm. Thời gian phát hiện và tải tin nhắn trên mỗi node không đổi khi nhóm lớn lên, đúng phần mà demo cho thấy."
    - title: "Lifeguard: Local Health Awareness for More Accurate Failure Detection"
      authors: "Armon Dadgar, James Phillips, Jon Currey"
      venue: "arXiv 2017"
      url: "https://arxiv.org/abs/1707.00788"
      en: "HashiCorp's fixes to SWIM after running it in production: a slow node should doubt its own judgement before accusing others, which cut false positives sharply."
      vi: "Các cải tiến của HashiCorp cho SWIM sau khi chạy thực tế: node chậm nên nghi ngờ chính phán đoán của mình trước khi buộc tội node khác, giúp giảm mạnh báo động giả."
    - title: "Randomized Rumor Spreading"
      authors: "Richard Karp, Christian Schindelhauer, Scott Shenker, Berthold Vöcking"
      venue: "FOCS 2000"
      url: "https://doi.org/10.1109/SFCS.2000.892324"
      en: "How many messages rumour spreading really needs, and how push-pull beats pure push. This is the theory behind the push/pull/push-pull setting."
      vi: "Rumour spreading thật sự cần bao nhiêu tin nhắn, và push-pull hơn push thuần ra sao. Đây là lý thuyết đứng sau lựa chọn push/pull/push-pull."
    - title: "On spreading a rumor"
      authors: "Boris Pittel"
      venue: "SIAM Journal on Applied Mathematics, 1987"
      url: "https://doi.org/10.1137/0147013"
      en: "The classic analysis showing that push gossip reaches all N nodes in about log₂N + ln N rounds with high probability."
      vi: "Phân tích kinh điển chỉ ra rằng push gossip chạm tới cả N node trong khoảng log₂N + ln N vòng với xác suất cao."
    - title: "Epidemic Broadcast Trees (Plumtree)"
      authors: "João Leitão, José Pereira, Luís Rodrigues"
      venue: "SRDS 2007"
      url: "https://www.dpss.inesc-id.pt/~ler/reports/srds07.pdf"
      en: "Gossip is robust but wasteful: duplicates everywhere. Plumtree builds a spanning tree for the common case and keeps gossip as the repair path."
      vi: "Gossip bền nhưng lãng phí: bản trùng khắp nơi. Plumtree dựng cây bao trùm cho trường hợp thường và giữ gossip làm đường sửa lỗi."
  reading:
    - title: "Gossip protocol"
      source: "Wikipedia"
      url: "https://en.wikipedia.org/wiki/Gossip_protocol"
      en: "A short map of the field: the push, pull and push-pull models, convergence properties and where gossip is used."
      vi: "Bản đồ ngắn của lĩnh vực: các mô hình push, pull và push-pull, tính chất hội tụ và nơi gossip được dùng."
    - title: "Serf: gossip protocol internals"
      source: "serf.io"
      url: "https://www.serf.io/docs/internals/gossip.html"
      en: "How a production system adapted SWIM: UDP and TCP use, suspicion tuning, and the changes it made to the original paper."
      vi: "Một hệ thống thật đã điều chỉnh SWIM thế nào: dùng UDP và TCP, tinh chỉnh nghi ngờ, và các thay đổi so với bài báo gốc."
    - title: "Serf convergence simulator"
      source: "serf.io"
      url: "https://www.serf.io/docs/internals/simulator.html"
