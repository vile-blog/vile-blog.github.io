# Content for the /lab/ deep-dive panels. Rendered by lab.html.
# Every *_vi field is the Vietnamese version; link titles stay in their original language.

raft:
  overview: "Raft is a consensus algorithm: it lets a cluster of machines agree on one ordered log of commands even when some machines crash or the network drops messages. It was designed to be easier to understand than Paxos by splitting the problem into three parts: leader election, log replication, and safety. Time is cut into numbered terms (a logical clock). Each term has at most one leader, and a leader needs votes from a majority, so two leaders can never both be legitimate in the same term."
  overview_vi: "Raft là thuật toán đồng thuận: cho phép một cụm máy cùng thống nhất một nhật ký lệnh có thứ tự, kể cả khi một số máy sập hoặc mạng làm mất gói tin. Nó được thiết kế dễ hiểu hơn Paxos bằng cách tách bài toán thành ba phần: bầu leader, sao chép log và tính an toàn. Thời gian được chia thành các term đánh số (một đồng hồ logic). Mỗi term có tối đa một leader, và leader cần phiếu của đa số, nên hai leader không bao giờ cùng hợp lệ trong một term."
  how:
    - en: "Every node starts as a follower with a randomised election timeout. Randomness is what stops everyone from running for office at the same moment."
      vi: "Mọi node bắt đầu là follower với bộ đếm bầu cử ngẫu nhiên. Tính ngẫu nhiên giúp không phải ai cũng ứng cử cùng lúc."
    - en: "No heartbeat before the timer fires? The node becomes a candidate, increments its term, votes for itself and sends RequestVote to everyone."
      vi: "Hết giờ mà chưa có heartbeat? Node thành candidate, tăng term, tự bầu cho mình và gửi RequestVote cho mọi người."
    - en: "Each node grants at most one vote per term. A candidate that collects a majority (3 of 5) becomes leader and immediately sends heartbeats so nobody else starts an election."
      vi: "Mỗi node chỉ bỏ tối đa một phiếu mỗi term. Candidate gom được đa số (3/5) sẽ thành leader và gửi heartbeat ngay để không ai khác ứng cử."
    - en: "A write goes to the leader, which appends it to its log and sends AppendEntries. Once a majority has stored the entry it is committed, and only then is it safe to tell the client it succeeded."
      vi: "Thao tác ghi đi vào leader, leader thêm vào log rồi gửi AppendEntries. Khi đa số đã lưu thì entry được commit, và chỉ lúc đó mới an toàn để báo thành công cho client."
    - en: "Any node that sees a higher term immediately steps down to follower. After a partition heals, the old leader discovers the newer term and abandons its uncommitted entries."
      vi: "Node nào thấy term cao hơn sẽ lập tức hạ xuống follower. Sau khi mạng nối lại, leader cũ phát hiện term mới hơn và bỏ các entry chưa commit."
  simplified:
    en: "This demo is deliberately simplified: one value per write instead of a real log, no prevLogIndex/prevLogTerm consistency check, no persistence across restarts, no membership changes, and no snapshots."
    vi: "Bản demo cố ý đơn giản hóa: mỗi lần ghi chỉ một giá trị thay vì log thật, không kiểm tra prevLogIndex/prevLogTerm, không lưu bền qua lần khởi động lại, không đổi thành viên cụm và không snapshot."
  notice:
    en: "Try this: split the network and wait. The two-node side keeps timing out and its term climbs. When you heal the network, that inflated term can knock a healthy leader down. This is the real 'disruptive server' problem, and it is why production Raft implementations add a Pre-Vote phase (Ongaro's thesis, section 9.6)."
    vi: "Thử xem: chia mạng rồi chờ. Phía hai node liên tục hết giờ và term cứ tăng. Khi nối mạng lại, term phình to đó có thể hất đổ một leader đang khỏe. Đây chính là vấn đề 'disruptive server' có thật, và là lý do các bản Raft thực tế thêm pha Pre-Vote (luận án của Ongaro, mục 9.6)."
  experiments:
    - id: kill-leader
      en: "Kill the leader"
      vi: "Hạ leader"
    - id: isolate-leader
      en: "Isolate the leader in a minority"
      vi: "Cô lập leader vào phía thiểu số"
    - id: lose-quorum
      en: "Lose quorum (crash 3 nodes)"
      vi: "Mất quorum (sập 3 node)"
  usecases:
    - name: "etcd (Kubernetes)"
      en: "The key-value store behind every Kubernetes cluster. All cluster state lives in an etcd Raft group, so a 3 or 5 member etcd decides whether your control plane survives a node failure."
      vi: "Kho key-value đứng sau mọi cụm Kubernetes. Toàn bộ trạng thái cụm nằm trong một nhóm Raft của etcd, nên etcd 3 hay 5 node quyết định control plane có sống sót khi một node hỏng."
      url: "https://etcd.io/docs/latest/learning/why/"
    - name: "Consul"
      en: "HashiCorp Consul's server agents use Raft to replicate the service catalog and key-value data; the leader serves writes."
      vi: "Các server agent của HashiCorp Consul dùng Raft để sao chép danh mục dịch vụ và dữ liệu key-value; leader phục vụ thao tác ghi."
      url: "https://developer.hashicorp.com/consul/docs/architecture/consensus"
    - name: "CockroachDB"
      en: "Data is cut into ranges and each range is its own Raft group, so thousands of small leader elections run in parallel across the cluster."
      vi: "Dữ liệu chia thành các range và mỗi range là một nhóm Raft riêng, nên hàng nghìn cuộc bầu cử nhỏ chạy song song trong cụm."
      url: "https://www.cockroachlabs.com/docs/stable/architecture/replication-layer"
    - name: "TiKV / TiDB"
      en: "The 'multi-Raft' design: each region of data has a Raft group and leaders are balanced across stores."
      vi: "Thiết kế 'multi-Raft': mỗi region dữ liệu có một nhóm Raft và leader được cân bằng giữa các store."
      url: "https://tikv.org/deep-dive/scalability/multi-raft/"
    - name: "Apache Kafka (KRaft)"
      en: "Kafka dropped ZooKeeper: a Raft-based controller quorum now stores the cluster metadata."
      vi: "Kafka bỏ ZooKeeper: một controller quorum dựa trên Raft giờ lưu metadata của cụm."
      url: "https://kafka.apache.org/documentation/#kraft"
    - name: "RabbitMQ quorum queues"
      en: "Replicated, durable queues built on Raft, replacing the older mirrored queues."
      vi: "Hàng đợi bền được sao chép dựa trên Raft, thay cho mirrored queue kiểu cũ."
      url: "https://www.rabbitmq.com/docs/quorum-queues"
  papers:
    - title: "In Search of an Understandable Consensus Algorithm"
      authors: "Diego Ongaro, John Ousterhout"
      venue: "USENIX ATC 2014"
      url: "https://raft.github.io/raft.pdf"
      en: "The original Raft paper. Short, readable, and Figure 2 is a complete spec of the algorithm."
      vi: "Bài báo Raft gốc. Ngắn, dễ đọc, và Hình 2 là đặc tả đầy đủ của thuật toán."
    - title: "Consensus: Bridging Theory and Practice"
      authors: "Diego Ongaro"
      venue: "PhD thesis, Stanford, 2014"
      url: "https://web.stanford.edu/~ouster/cgi-bin/papers/OngaroPhD.pdf"
      en: "The long version: membership changes, log compaction, client interaction, and the Pre-Vote fix for disruptive servers."
      vi: "Bản đầy đủ: đổi thành viên, nén log, tương tác với client và cách sửa Pre-Vote cho disruptive server."
    - title: "Paxos Made Simple"
      authors: "Leslie Lamport"
      venue: "ACM SIGACT News, 2001"
      url: "https://lamport.azurewebsites.net/pubs/paxos-simple.pdf"
      en: "The algorithm Raft was designed to be an easier alternative to. Reading both makes each clearer."
      vi: "Thuật toán mà Raft muốn thay thế bằng một lựa chọn dễ hiểu hơn. Đọc cả hai sẽ thấy mỗi bên rõ hơn."
    - title: "Viewstamped Replication Revisited"
      authors: "Barbara Liskov, James Cowling"
      venue: "MIT-CSAIL-TR-2012-021"
      url: "https://dspace.mit.edu/handle/1721.1/71763"
      en: "A 1988 protocol that is remarkably close to Raft, restated in modern terms."
      vi: "Giao thức từ 1988 rất gần với Raft, được phát biểu lại theo cách hiện đại."
    - title: "Impossibility of Distributed Consensus with One Faulty Process"
      authors: "Fischer, Lynch, Paterson"
      venue: "JACM, 1985"
      url: "https://groups.csail.mit.edu/tds/papers/Lynch/jacm85.pdf"
      en: "The FLP result: with a fully asynchronous network no algorithm can guarantee termination. Raft sidesteps it with timeouts, which is why it is only live when the network is reasonably timely."
      vi: "Kết quả FLP: với mạng bất đồng bộ hoàn toàn, không thuật toán nào đảm bảo kết thúc. Raft né bằng timeout, nên chỉ 'sống' khi mạng đủ ổn định."
    - title: "Paxos Made Live: An Engineering Perspective"
      authors: "Chandra, Griesemer, Redstone"
      venue: "PODC 2007"
      url: "https://research.google/pubs/pub33002/"
      en: "What it really took to run Paxos inside Google's Chubby: disk corruption, snapshots, membership change."
      vi: "Thực tế cần gì để chạy Paxos trong Chubby của Google: lỗi đĩa, snapshot, đổi thành viên."
  reading:
