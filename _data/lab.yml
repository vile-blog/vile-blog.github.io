crdt:
  overview: "A CRDT (conflict-free replicated data type) is a data structure designed so that replicas can be edited independently, even offline, and then merged in any order with a guaranteed identical result. The trick is mathematical: state is a join-semilattice and merge is its least upper bound, which is commutative, associative and idempotent. Duplicates, reordering and delays are harmless, so no coordination is needed. That gives strong eventual consistency: any two replicas that have seen the same updates are in the same state."
  overview_vi: "CRDT (conflict-free replicated data type) là cấu trúc dữ liệu được thiết kế để các replica được sửa độc lập, kể cả offline, rồi gộp theo thứ tự bất kỳ mà vẫn cho kết quả giống hệt nhau. Mẹo nằm ở toán: trạng thái là một join-semilattice và phép gộp là cận trên nhỏ nhất, có tính giao hoán, kết hợp và lũy đẳng. Bản trùng, đảo thứ tự và độ trễ đều vô hại nên không cần điều phối. Nhờ đó có strong eventual consistency: hai replica đã thấy cùng các cập nhật thì ở cùng trạng thái."
  how:
    - en: "Pick a data type whose merge can never lose information. For a counter, give each replica its own slot, so nobody overwrites anybody; a PN-counter keeps two such vectors (increments P and decrements N)."
      vi: "Chọn kiểu dữ liệu mà phép gộp không bao giờ làm mất thông tin. Với bộ đếm, mỗi replica có ô riêng nên không ai ghi đè ai; PN-counter giữ hai vector như vậy (tăng P và giảm N)."
    - en: "Merge by taking the element-wise maximum of every slot. Because max is idempotent, it does not matter if the same state arrives twice or in a different order."
      vi: "Gộp bằng cách lấy max từng phần tử của mọi ô. Vì max có tính lũy đẳng nên không quan trọng việc cùng một trạng thái đến hai lần hay theo thứ tự khác."
    - en: "For a set, a bare 'remove' is ambiguous when it races with an 'add'. The OR-set tags every add with a unique id and a remove deletes only the tags it has observed, so a concurrent re-add survives. This semantics is called add-wins."
      vi: "Với tập hợp, một lệnh 'xóa' trần sẽ mơ hồ khi chạy đua với 'thêm'. OR-set gắn mỗi lần thêm một id duy nhất và lệnh xóa chỉ xóa các tag nó đã thấy, nên lần thêm lại đồng thời vẫn sống. Ngữ nghĩa này gọi là add-wins."
    - en: "Replicas exchange full state (state-based CRDTs) or just the operations (operation-based CRDTs, which need reliable causal delivery). Either way they converge without a leader, consensus or locks."
      vi: "Replica trao đổi toàn bộ trạng thái (CRDT dựa trên state) hoặc chỉ các thao tác (CRDT dựa trên operation, cần giao nhận nhân quả đáng tin). Cách nào cũng hội tụ mà không cần leader, đồng thuận hay khóa."
  simplified:
    en: "Simplified: replicas sync by merging full state (real systems send deltas), tags and tombstones grow forever (real OR-sets compress them with causal contexts), and the naïve copy uses a global logical clock as its timestamp. Wall clocks with skew would make the naïve version lose even more data."
    vi: "Đã đơn giản hóa: replica đồng bộ bằng cách gộp toàn bộ state (hệ thống thật gửi delta), tag và tombstone tăng mãi (OR-set thật nén bằng causal context), và bản ngây thơ dùng đồng hồ logic toàn cục làm timestamp. Đồng hồ thật bị lệch sẽ khiến bản ngây thơ mất dữ liệu còn nhiều hơn."
  notice:
    en: "Try this: press +1 several times on every replica while all three are offline, then bring them back. The CRDT counts every click; the naïve copy keeps only the number from whichever replica wrote last. CRDTs do not remove conflicts, they choose a deterministic resolution (here, add-wins) that every replica reaches independently. You still have to decide whether that resolution is the one your application wants."
    vi: "Thử xem: bấm +1 nhiều lần trên mỗi replica khi cả ba đang offline, rồi cho chúng online lại. CRDT đếm đủ mọi lần bấm; bản ngây thơ chỉ giữ số của replica ghi sau cùng. CRDT không xóa bỏ xung đột, nó chọn một cách giải quyết xác định (ở đây là add-wins) mà mọi replica tự đạt tới. Bạn vẫn phải quyết định cách giải quyết đó có phải điều ứng dụng của bạn cần không."
  experiments:
    - id: offline-storm
      en: "Offline storm: 3 replicas × 5 clicks, then reconnect"
      vi: "Bão offline: 3 replica × 5 lần bấm rồi nối lại"
    - id: cart-conflict
      en: "Concurrent add and remove on a shopping cart"
      vi: "Thêm và xóa đồng thời trên giỏ hàng"
