ring:
  overview: "Consistent hashing places both servers and keys on the same circle of hash values. A key belongs to the first server found going clockwise. The point: when a server joins or leaves, only the keys in the arc next to it move, roughly 1/N of the data, whereas hash(key) mod N changes the answer for almost every key. That makes it the standard way to spread a cache or database across machines that come and go."
  overview_vi: "Consistent hashing đặt cả server lẫn key lên cùng một vòng tròn giá trị băm. Key thuộc về server đầu tiên gặp theo chiều kim đồng hồ. Điểm mấu chốt: khi một server vào hoặc ra, chỉ các key trong cung kề nó phải chuyển, khoảng 1/N dữ liệu, trong khi hash(key) mod N đổi đáp án của gần như mọi key. Vì vậy đây là cách chuẩn để chia cache hay database cho những máy liên tục vào ra."
  how:
    - en: "Hash each server name onto the ring (a number from 0 to 2^32). Hash each key onto the same ring."
      vi: "Băm tên mỗi server lên vòng tròn (một số từ 0 đến 2^32). Băm mỗi key lên cùng vòng tròn."
    - en: "To find a key's owner, walk clockwise from the key until you hit a server position."
      vi: "Để tìm chủ của một key, đi theo chiều kim đồng hồ từ key cho tới khi gặp vị trí của một server."
    - en: "Add a server: it lands somewhere on the ring and takes over only the keys between it and the previous server. Everyone else is untouched."
      vi: "Thêm server: nó rơi vào một chỗ trên vòng và chỉ nhận các key nằm giữa nó và server liền trước. Những server khác không bị đụng tới."
    - en: "With one point per server the arcs are very uneven (look at the load bars). Virtual nodes give each server many points, so the arcs average out and a removed server's load spreads over everyone instead of dumping on one neighbour."
      vi: "Với một điểm mỗi server, các cung rất lệch (xem thanh tải). Virtual node cho mỗi server nhiều điểm, các cung trung bình lại và tải của server bị gỡ được chia đều cho mọi người thay vì đổ hết lên một hàng xóm."
  simplified:
    en: "Simplifications: real systems also replicate each key to the next N distinct servers on the ring, weigh servers by capacity, and use stronger hash functions such as MurmurHash or xxHash."
    vi: "Đơn giản hóa: hệ thống thật còn sao chép mỗi key sang N server khác nhau kế tiếp trên vòng, gán trọng số theo dung lượng, và dùng hàm băm mạnh hơn như MurmurHash hay xxHash."
  notice:
    en: "Try this: with 1 virtual node, add a server and note the load bars. Then slide to 40 and add another. Movement stays near 1/N while the load becomes far more even. Removing a server shows the other half of the story."
    vi: "Thử xem: với 1 virtual node, thêm server và nhìn các thanh tải. Rồi kéo lên 40 và thêm nữa. Lượng key chuyển vẫn quanh 1/N trong khi tải đều hơn nhiều. Bớt một server cho thấy nửa còn lại của câu chuyện."
  experiments:
    - id: few-vnodes
      en: "Add a server (1 virtual node)"
      vi: "Thêm server (1 virtual node)"
    - id: many-vnodes
      en: "Add a server (40 virtual nodes)"
      vi: "Thêm server (40 virtual node)"
    - id: remove-one
      en: "Remove a server"
      vi: "Bớt một server"
  usecases:
    - name: "Cassandra / ScyllaDB / Dynamo"
      en: "The token ring: each node owns ranges of the hash space (many virtual nodes per machine) and each key is replicated to the following nodes."
      vi: "Token ring: mỗi node sở hữu các khoảng của không gian băm (nhiều virtual node mỗi máy) và mỗi key được sao chép sang các node kế tiếp."
      url: "https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html"
    - name: "Memcached client sharding"
      en: "Libraries like ketama hash keys onto a ring of cache servers, so adding a cache node does not wipe the whole cache."
      vi: "Các thư viện như ketama băm key lên vòng các server cache, nên thêm một node cache không làm mất toàn bộ cache."
      url: "https://github.com/RJ/ketama"
    - name: "Load balancers (Envoy, NGINX)"
      en: "Sticky routing by user, session or URL: the same key keeps landing on the same backend, and backends can scale without remapping everything."
      vi: "Định tuyến dính theo user, session hay URL: cùng một key luôn về cùng một backend, và backend có thể scale mà không phải ánh xạ lại tất cả."
      url: "https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/load_balancing/load_balancers"
    - name: "Content delivery networks"
      en: "The idea was invented for web caching: map a URL to a cache server so popular pages are fetched from an origin once, even as caches are added or fail."
      vi: "Ý tưởng sinh ra cho web caching: ánh xạ URL tới một server cache để trang phổ biến chỉ lấy từ origin một lần, kể cả khi cache được thêm hay hỏng."
      url: "https://en.wikipedia.org/wiki/Consistent_hashing"
    - name: "Google Maglev"
      en: "Google's software load balancer uses a faster, more balanced table-based variant so that connections are minimally disrupted when backends change."
      vi: "Bộ cân bằng tải phần mềm của Google dùng biến thể dựa trên bảng, nhanh và cân bằng hơn, để kết nối ít bị xáo trộn nhất khi backend thay đổi."
      url: "https://research.google/pubs/maglev-a-fast-and-reliable-software-network-load-balancer/"
  papers:
    - title: "Consistent Hashing and Random Trees"
      authors: "Karger, Lehman, Leighton, Panigrahy, Levine, Lewin"
      venue: "ACM STOC 1997"
      url: "https://dl.acm.org/doi/10.1145/258533.258660"
      en: "The original paper, motivated by relieving hot spots on the web. Founding text of the whole topic."
      vi: "Bài báo gốc, xuất phát từ việc giảm điểm nóng trên web. Văn bản nền tảng của cả chủ đề."
    - title: "Dynamo: Amazon's Highly Available Key-value Store"
      authors: "DeCandia et al."
      venue: "SOSP 2007"
      url: "https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf"
      en: "Made consistent hashing with virtual nodes mainstream in databases. Section 6.2 compares the partitioning strategies they tried."
      vi: "Đưa consistent hashing với virtual node thành phổ biến trong database. Mục 6.2 so sánh các chiến lược phân mảnh họ đã thử."
    - title: "Chord: A Scalable Peer-to-peer Lookup Service"
      authors: "Stoica, Morris, Karger, Kaashoek, Balakrishnan"
      venue: "SIGCOMM 2001"
      url: "https://pdos.csail.mit.edu/papers/chord:sigcomm01/chord_sigcomm.pdf"
      en: "A distributed hash table on a ring where every node needs to know only O(log N) others."
      vi: "Một bảng băm phân tán trên vòng tròn, trong đó mỗi node chỉ cần biết O(log N) node khác."
    - title: "Consistent Hashing with Bounded Loads"
      authors: "Mirrokni, Thorup, Zadimoghaddam"
      venue: "arXiv 2016 (SODA 2018)"
      url: "https://arxiv.org/abs/1608.01350"
      en: "Caps how overloaded any server can get while keeping movement low. Used by Google Cloud Pub/Sub and Vimeo's load balancing."
      vi: "Giới hạn mức quá tải của mỗi server mà vẫn giữ lượng chuyển dịch thấp. Được dùng trong Google Cloud Pub/Sub và cân bằng tải của Vimeo."
    - title: "A Fast, Minimal Memory, Consistent Hash Algorithm (Jump Hash)"
      authors: "John Lamping, Eric Veach"
      venue: "arXiv 2014"
      url: "https://arxiv.org/abs/1406.2294"
      en: "A five-line algorithm with zero memory and perfect balance, at the cost of only being able to add or remove the last bucket."
      vi: "Thuật toán năm dòng, không tốn bộ nhớ, cân bằng hoàn hảo, đổi lại chỉ thêm hoặc bớt được bucket cuối."
    - title: "Maglev: A Fast and Reliable Software Network Load Balancer"
      authors: "Eisenbud et al."
      venue: "NSDI 2016"
      url: "https://research.google/pubs/maglev-a-fast-and-reliable-software-network-load-balancer/"
      en: "Maglev hashing: lookup-table consistent hashing tuned for even load and fast lookup."
      vi: "Maglev hashing: consistent hashing dùng bảng tra, tối ưu cho tải đều và tra cứu nhanh."
  reading:
    - title: "Consistent Hashing"
      source: "Tom White"
      url: "http://www.tom-e-white.com/2007/11/consistent-hashing.html"
      en: "A classic, short, code-first walkthrough with the effect of replicas (virtual nodes) on balance."
      vi: "Bài kinh điển, ngắn, đi từ code, cho thấy ảnh hưởng của số replica (virtual node) lên độ cân bằng."
    - title: "Consistent Hashing with Bounded Loads"
      source: "Google Research blog"
      url: "https://research.google/blog/consistent-hashing-with-bounded-loads/"
      en: "Plain-language explanation of why plain consistent hashing can overload a server and how bounded loads fixes it."
      vi: "Giải thích dễ hiểu vì sao consistent hashing thuần có thể quá tải một server và bounded loads sửa thế nào."
    - title: "Consistent hashing (overview)"
      source: "Wikipedia"
      url: "https://en.wikipedia.org/wiki/Consistent_hashing"
      en: "Good map of the variants: rendezvous hashing, jump hash, Maglev, multi-probe."
      vi: "Bản đồ tốt về các biến thể: rendezvous hashing, jump hash, Maglev, multi-probe."
