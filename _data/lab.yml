tabs:
  overview: "This card is a real, if tiny, cluster. Each browser tab running this page is a node; they talk over a BroadcastChannel, run a Raft-style election, and replicate a counter through the elected leader. Nothing is simulated except the crash button. It shows the point of a leader: one node decides the order of writes, and the others must be able to notice when it is gone and agree on a successor. A second mechanism runs alongside for comparison: the Web Locks API, where the browser itself hands the lock to exactly one tab."
  overview_vi: "Card này là một cụm thật, dù rất nhỏ. Mỗi tab trình duyệt chạy trang này là một node; chúng nói chuyện qua BroadcastChannel, chạy bầu cử kiểu Raft và sao chép một bộ đếm qua leader được bầu. Không có gì là mô phỏng ngoại trừ nút làm sập. Nó cho thấy ý nghĩa của leader: một node quyết định thứ tự ghi, và các node khác phải nhận ra khi nó biến mất và thống nhất người kế nhiệm. Một cơ chế thứ hai chạy song song để so sánh: Web Locks API, nơi chính trình duyệt trao khóa cho đúng một tab."
  how:
    - en: "Every tab sends a presence beacon about every 0.7 s and forgets any tab it has not heard from for 3.6 s. That is its membership view: the node count and the majority are computed from it."
      vi: "Mỗi tab gửi tín hiệu hiện diện khoảng mỗi 0,7 giây và quên tab nào đã im 3,6 giây. Đó là góc nhìn thành viên của nó: số node và đa số được tính từ đó."
    - en: "With no heartbeat from a leader, a randomised timer (2.8 to 5 s) fires and the tab becomes a candidate: it increments its term, votes for itself and broadcasts RequestVote. A tab grants one vote per term; a majority makes the leader."
      vi: "Không có heartbeat từ leader thì bộ đếm ngẫu nhiên (2,8 đến 5 giây) nổ và tab thành candidate: tăng term, tự bỏ phiếu cho mình và phát RequestVote. Mỗi tab chỉ bỏ một phiếu mỗi term; đa số phiếu thì thành leader."
    - en: "The leader heartbeats every 0.7 s. A write (+1) from any tab is forwarded to the leader, which proposes an entry. Followers acknowledge, and once a majority has stored it the entry is committed and the new value is announced in the next heartbeat."
      vi: "Leader gửi heartbeat mỗi 0,7 giây. Lệnh ghi (+1) từ tab nào cũng được chuyển tới leader, leader đề xuất một entry. Follower xác nhận, và khi đa số đã lưu thì entry được commit và giá trị mới được báo trong heartbeat kế tiếp."
    - en: "Close the leader's tab (or press Crash). Others stop hearing heartbeats, one times out first, wins the next term and the ♛ moves. Meanwhile the Web Lock holder changes instantly, because the lock service is the browser, not a set of timeouts."
      vi: "Đóng tab của leader (hoặc bấm Làm sập). Các tab khác không còn nghe heartbeat, một tab hết giờ trước, thắng term kế tiếp và ♛ chuyển đi. Trong khi đó người giữ Web Lock đổi ngay lập tức, vì dịch vụ khóa là trình duyệt chứ không phải các bộ đếm thời gian."
  simplified:
    en: "Simplified and a bit unsafe on purpose: membership is whatever the liveness timer says (real Raft uses explicit, committed membership changes), entries not yet committed are discarded on a leader change instead of being reconciled by a log comparison, and nothing is persisted, so closing every tab resets the counter. Browsers also throttle timers in background tabs (to about once a second, and much more after a few minutes), which is why the timeouts here are seconds rather than milliseconds."
    vi: "Đơn giản hóa và cố ý hơi thiếu an toàn: thành viên là những gì bộ đếm sống/chết cho biết (Raft thật dùng thay đổi thành viên tường minh và được commit), các entry chưa commit bị bỏ khi đổi leader thay vì đối chiếu log, và không có gì được lưu bền nên đóng hết tab thì bộ đếm về 0. Trình duyệt cũng giảm tốc bộ đếm ở tab nền (còn khoảng một lần mỗi giây, và nặng hơn nhiều sau vài phút), nên các timeout ở đây tính bằng giây chứ không phải mili giây."
  notice:
    en: "Try this: open three tabs, find the one with the ♛ in its title, press +1 a few times from different tabs, then close the leader's tab. Within a few seconds a new leader appears and the committed counter is still right. Close all but one tab and writes still work (a one-node majority), which is exactly why real clusters fix their membership instead of using a liveness timer."
    vi: "Thử xem: mở ba tab, tìm tab có ♛ trên tiêu đề, bấm +1 vài lần từ các tab khác nhau, rồi đóng tab của leader. Sau vài giây một leader mới xuất hiện và bộ đếm đã commit vẫn đúng. Đóng hết trừ một tab thì vẫn ghi được (đa số của một node), và chính vì vậy các cụm thật cố định danh sách thành viên thay vì dùng bộ đếm sống/chết."
  experiments:
    - id: open-two
      en: "Open two more tabs"
      vi: "Mở thêm hai tab"
    - id: burst
      en: "Send +1 five times"
      vi: "Gửi +1 năm lần"
    - id: crash-me
      en: "Crash / recover this tab"
      vi: "Làm sập / hồi phục tab này"
  usecases:
    - name: "Leader tab election in web apps"
      en: "Apps that keep one WebSocket or one sync worker per browser, not per tab, elect a leader tab with the Web Locks API or a BroadcastChannel protocol. If the leader tab closes, a follower takes over."
      vi: "Ứng dụng chỉ giữ một WebSocket hay một worker đồng bộ cho cả trình duyệt chứ không phải mỗi tab sẽ bầu một tab leader bằng Web Locks API hoặc giao thức BroadcastChannel. Nếu tab leader đóng, một follower lên thay."
      url: "https://developer.mozilla.org/en-US/docs/Web/API/Web_Locks_API"
    - name: "broadcast-channel (npm)"
      en: "A library with a built-in LeaderElection helper across tabs, workers and Node processes."
      vi: "Thư viện có sẵn tiện ích LeaderElection giữa các tab, worker và tiến trình Node."
      url: "https://github.com/pubkey/broadcast-channel"
    - name: "Kubernetes leases"
      en: "Controllers and schedulers that run several replicas elect one active leader by renewing a Lease object; if it stops renewing, another replica takes over."
      vi: "Các controller và scheduler chạy nhiều bản sao bầu ra một leader đang hoạt động bằng cách gia hạn một đối tượng Lease; nếu nó ngừng gia hạn, một bản sao khác tiếp quản."
      url: "https://kubernetes.io/docs/concepts/architecture/leases/"
    - name: "ZooKeeper leader election"
      en: "The classic recipe: each candidate creates an ephemeral sequential znode and the lowest number leads. When its session dies the znode vanishes and the next one takes over."
      vi: "Công thức kinh điển: mỗi candidate tạo một znode tạm thời có số thứ tự và số nhỏ nhất làm leader. Khi session của nó chết, znode biến mất và node kế tiếp tiếp quản."
      url: "https://zookeeper.apache.org/doc/current/recipes.html"
    - name: "Chubby"
      en: "Google's lock service, used so many systems could elect a master by grabbing a lock instead of each implementing consensus themselves."
      vi: "Dịch vụ khóa của Google, giúp nhiều hệ thống bầu master bằng cách giành khóa thay vì mỗi hệ thống tự cài đặt đồng thuận."
      url: "https://research.google/pubs/the-chubby-lock-service-for-loosely-coupled-distributed-systems/"
  papers:
    - title: "In Search of an Understandable Consensus Algorithm"
      authors: "Diego Ongaro, John Ousterhout"
      venue: "USENIX ATC 2014"
      url: "https://raft.github.io/raft.pdf"
      en: "The election and replication rules this card follows, minus persistence and membership changes."
      vi: "Các luật bầu cử và sao chép mà card này theo, trừ lưu bền và thay đổi thành viên."
    - title: "The Chubby lock service for loosely-coupled distributed systems"
      authors: "Mike Burrows"
      venue: "OSDI 2006"
      url: "https://research.google/pubs/the-chubby-lock-service-for-loosely-coupled-distributed-systems/"
      en: "Why Google built a lock service and not a consensus library. The same trade-off as Web Locks versus rolling your own election."
      vi: "Vì sao Google xây dịch vụ khóa chứ không phải thư viện đồng thuận. Cùng sự đánh đổi giữa Web Locks và tự viết bầu cử."
    - title: "ZooKeeper: Wait-free coordination for Internet-scale systems"
      authors: "Patrick Hunt, Mahadev Konar, Flavio Junqueira, Benjamin Reed"
