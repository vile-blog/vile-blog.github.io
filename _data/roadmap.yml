        heading_vi: "Độ tin cậy của nền tảng"
        points:
          - en: "Led reliability work (Datadog dashboards, runbooks): cut silent-failure detection time from 25 hours to minutes and MTTR by 30–50%, saving 40+ engineering hours a year."
            vi: "Dẫn dắt việc nâng độ tin cậy (dashboard Datadog, runbook): rút thời gian phát hiện lỗi âm thầm từ 25 giờ xuống còn vài phút, giảm MTTR 30–50%, tiết kiệm hơn 40 giờ kỹ sư mỗi năm."
          - en: "Eliminated 60–70M silently dropped messages per day on a platform handling 1.1B messages per day."
