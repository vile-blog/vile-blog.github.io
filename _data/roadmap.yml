# Roadmap section — rendered by _includes/roadmap.html
#
# `milestones` run left to right along the track. Cards alternate above and
# below the line automatically. `status` is one of:
#   achieved | now | target
# Exactly one milestone should be `now`; the green progress fill stops there.
# The `destination` card is drawn at the end of the track with a flag.
#
# Clicking a card opens a dialog with the optional `details`:
#   details:  list of groups -> { heading, heading_vi, points: [{ en, vi }] }
#   links:    list of { label, url }
# A card without `details` / `links` is not clickable.
#
# Every user-facing string has an _vi twin (the site switches EN/VI together).

milestones:
  - status: achieved
    label: "2021 – 2024"
    title: "Computer Science foundation"
    title_vi: "Nền tảng Khoa học máy tính"
    text: "Bachelor's in Computer Science at IUH, and a research paper on the A* algorithm accepted by IEEE."
    text_vi: "Cử nhân Khoa học máy tính tại IUH, và một bài báo khoa học về thuật toán A* được IEEE chấp nhận."
    details:
      - heading: "Education"
        heading_vi: "Học vấn"
        points:
          - en: "B.S. in Computer Science, Industrial University of Ho Chi Minh City (IUH) — GPA 3.83/4.0."
            vi: "Cử nhân Khoa học máy tính, Đại học Công nghiệp TP.HCM (IUH) — GPA 3.83/4.0."
          - en: "English: professional working proficiency."
