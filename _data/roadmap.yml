      - heading: "Research — accepted by IEEE"
        heading_vi: "Nghiên cứu — được IEEE chấp nhận"
        points:
          - en: "Optimizing the A* Algorithm: Enhancing Efficiency and Performance in Pathfinding."
            vi: "Optimizing the A* Algorithm: Enhancing Efficiency and Performance in Pathfinding."
          - en: "Disproved textbook pathfinding claims: BFS peak memory is 43× smaller than DFS on 2D grids, and A* needs about 25% obstacle density to overcome its heap overhead."
            vi: "Bác bỏ một số nhận định kinh điển về tìm đường: bộ nhớ đỉnh của BFS nhỏ hơn DFS tới 43 lần trên lưới 2D, và A* cần mật độ chướng ngại vật khoảng 25% mới bù được chi phí heap."
      - heading: "Awards & optimization work"
        heading_vi: "Giải thưởng & bài toán tối ưu"
        points:
          - en: "National First Prize — Eureka Student Scientific Research Award."
            vi: "Giải Nhất Quốc gia — Giải thưởng Sinh viên Nghiên cứu Khoa học Eureka."
          - en: "Vehicle Routing Problem solver for Vissan: 63 customers under capacity (2,000 units) and time (48h) constraints with Ant Colony Optimization, cutting travel distance and fuel costs."
            vi: "Bộ giải bài toán định tuyến phương tiện cho Vissan: 63 khách hàng với ràng buộc tải trọng (2.000 đơn vị) và thời gian (48 giờ) bằng thuật toán đàn kiến, giảm quãng đường và chi phí nhiên liệu."

