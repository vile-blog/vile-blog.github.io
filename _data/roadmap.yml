            vi: "Đồng tác giả chiến lược observability AIX: chuẩn hóa quy ước monitor/alert, metric cho các luồng nghiệp vụ trọng yếu, và AI agent gợi ý nguyên nhân gốc qua dashboard, alert và runbook."
